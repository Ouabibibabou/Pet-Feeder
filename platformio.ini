[platformio]
src_dir = .
default_envs = uno

[env:uno]
platform = atmelavr@5.1.0
board = uno
framework = arduino
build_src_filter = -<*> +<src/main.cpp> +<include/*.cpp>
monitor_speed = 115200
lib_deps =
    marcoschwartz/LiquidCrystal_I2C@1.1.4
    bogde/HX711@0.7.5
    arduino-libraries/Servo@1.2.2

; Synthetic scale fixtures for AVR8js; never upload these environments.
[env:sim_hopper]
extends = env:uno
build_flags = -DFEEDER_SIM_MOUNT=Hopper

[env:sim_bowl]
extends = env:uno
build_flags = -DFEEDER_SIM_MOUNT=Bowl
